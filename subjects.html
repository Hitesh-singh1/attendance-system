<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172b43" />
    <title>Subjects | Campusly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <script src="js/student-pages.js" defer></script>
  </head>
  <body class="standalone-student-page">
    <header class="topbar">
      <a class="brand" href="index.html"
        ><span class="brand-mark">C</span><span>campusly</span></a
      >
      <nav class="home-nav" aria-label="Main navigation">
        <a class="home-link" href="index.html">Home</a
        ><a class="home-link active" href="subjects.html">Subjects</a
        ><a class="home-link" href="history.html">History</a
        ><a class="home-link" href="planner.html">Planner</a>
      </nav>
      <div class="topbar-right">
        <span class="term-pill"
          ><span class="live-dot"></span> Current semester</span
        ><a
          class="avatar profile-link"
          href="profile.html"
          id="pageAvatar"
          aria-label="Student details"
          >—</a
        ><button class="logout-button" id="pageLogout" type="button">
          Log out
        </button>
      </div>
    </header>
    <main class="main-content">
      <div class="page-wrap">
        <section class="welcome-row">
          <div>
            <div class="eyebrow">SUBJECT ATTENDANCE</div>
            <h1>Your subjects</h1>
            <p id="pageStudentLine">
              Attendance details for your current semester.
            </p>
          </div>
          <a class="button" href="planner.html"
            >Open attendance planner <span>→</span></a
          >
        </section>
        <section class="page-subject-summary" id="subjectSummary"></section>
        <section
          class="subject-grid standalone-subject-grid"
          id="pageSubjectGrid"
          aria-live="polite"
        ></section>
        <footer class="page-footer">
          <span>Campusly student portal</span
          ><a href="history.html">View attendance history →</a>
        </footer>
      </div>
    </main>
  </body>
</html>
